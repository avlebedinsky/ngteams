[package]
name = "dispatch-status"
description = "The task-dispatch skill's live status page: the dispatcher's ledger and its agents' transcripts, served on 127.0.0.1"
version = "0.1.0"
edition = "2024"
publish = false

# A workspace of its own: this is the skill's tool, not part of the app, and it stays out of the app's dependency
# resolution, builds and coverage gate. rustup, clippy and rustfmt still find the repo's rust-toolchain.toml,
# clippy.toml and rustfmt.toml by walking up from here.
[workspace]

# std and serde_json only (no HTTP crate, no serde derive): the dispatcher builds it at the start of every dispatch
# session, so a cold build stays a few seconds.
[dependencies]
serde_json = "1.0.154"

# The same rules as the app's [workspace.lints].
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# complexity (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
# robustness
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# FFI
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# exceptions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
