name: ngteams
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
version_schema: none
release: 1
maintainer: Nick Alie <nickalie@users.noreply.github.com>
description: Native Microsoft Teams client for Linux
homepage: https://github.com/nickalie/ngteams
# xz: nfpm's gzip default costs a large package several MB; every dpkg and rpm these packages install on reads xz.
deb:
  compression: xz
rpm:
  compression: xz
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
contents:
  - src: ${PACKAGE_ROOT}/
    dst: /opt/ngteams
    type: tree
  - src: /opt/ngteams/usr/bin/ngteams
    dst: /usr/bin/ngteams
    type: symlink
  - src: /opt/ngteams/usr/bin/ngteamsctl
    dst: /usr/bin/ngteamsctl
    type: symlink
  - src: packaging/com.nickalie.ngteams.desktop
    dst: /usr/share/applications/com.nickalie.ngteams.desktop
  - src: packaging/icons/hicolor/
    dst: /usr/share/icons/hicolor
    type: tree
  - src: ${PACKAGE_ROOT}/usr/share/bash-completion/completions/ngteamsctl
    dst: /usr/share/bash-completion/completions/ngteamsctl
  - src: ${PACKAGE_ROOT}/usr/share/fish/vendor_completions.d/ngteamsctl.fish
    dst: /usr/share/fish/vendor_completions.d/ngteamsctl.fish
  - src: ${PACKAGE_ROOT}/usr/share/zsh/site-functions/_ngteamsctl
    dst: /usr/share/zsh/site-functions/_ngteamsctl
  - src: packaging/linux/apparmor/ngteams-release
    dst: /etc/apparmor.d/ngteams-release
    type: config
overrides:
  deb:
    depends:
      # the app's own NEEDED libraries (scripts/check-linux-package.py's allowed list)
      - "libc6 (>= 2.39)"
      - libgcc-s1
      - libxkbcommon0
      - libglib2.0-0t64
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libpipewire-0.3-0t64
      # the downloaded web engine runtime's host libraries (packaging/linux/runtime-libraries.txt)
      - "libstdc++6 (>= 13)"
      - bubblewrap
      - xdg-dbus-proxy
      - ca-certificates
      - libvulkan1
      - libegl1
      # dlopened by libepoxy (the runtime's), so no NEEDED entry names it
      - libgles2
      - libgl1
      - libglx0
      - libglvnd0
      - libx11-xcb1
      - libx11-6
      - libxcb1
      - libxcb-dri3-0
      - libasound2t64
      - libcom-err2
      - libdrm2
      - libexpat1
      - libfontconfig1
      - libfreetype6
      - libfribidi0
      - libgbm1
      - libgmp10
      - libgpg-error0
      - libharfbuzz0b
      - libwayland-client0
      - zlib1g
    recommends:
      - "libwpewebkit-2.0-1 (>= 2.54)"
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
      - gstreamer1.0-gl
      - gstreamer1.0-alsa
      - gstreamer1.0-pulseaudio
  rpm:
    depends:
      # the app's own NEEDED libraries (scripts/check-linux-package.py's allowed list)
      - "glibc >= 2.39"
      - "libgcc_s.so.1()(64bit)"
      - "libxkbcommon.so.0()(64bit)"
      - "libgio-2.0.so.0()(64bit)"
      - "libgobject-2.0.so.0()(64bit)"
      - "libglib-2.0.so.0()(64bit)"
      - "libgstreamer-1.0.so.0()(64bit)"
      - "libgstbase-1.0.so.0()(64bit)"
      - "libgstapp-1.0.so.0()(64bit)"
      - "libpipewire-0.3.so.0()(64bit)"
      # the downloaded web engine runtime's host libraries (packaging/linux/runtime-libraries.txt)
      - bubblewrap
      - xdg-dbus-proxy
      - ca-certificates
      - "libstdc++.so.6(GLIBCXX_3.4.32)(64bit)"
      - "libvulkan.so.1()(64bit)"
      - "libEGL.so.1()(64bit)"
      # dlopened by libepoxy (the runtime's), so no NEEDED entry names it
      - "libGLESv2.so.2()(64bit)"
      - "libGL.so.1()(64bit)"
      - "libGLX.so.0()(64bit)"
      - "libGLdispatch.so.0()(64bit)"
      - "libX11-xcb.so.1()(64bit)"
      - "libX11.so.6()(64bit)"
      - "libxcb.so.1()(64bit)"
      - "libxcb-dri3.so.0()(64bit)"
      - "libasound.so.2()(64bit)"
      - "libcom_err.so.2()(64bit)"
      - "libdrm.so.2()(64bit)"
      - "libexpat.so.1()(64bit)"
      - "libfontconfig.so.1()(64bit)"
      - "libfreetype.so.6()(64bit)"
      - "libfribidi.so.0()(64bit)"
      - "libgbm.so.1()(64bit)"
      - "libgmp.so.10()(64bit)"
      - "libgpg-error.so.0()(64bit)"
      - "libharfbuzz.so.0()(64bit)"
      - "libwayland-client.so.0()(64bit)"
      - "libz.so.1()(64bit)"
    recommends:
      - "libWPEWebKit-2_0-1 >= 2.54"
      - "wpewebkit >= 2.54"
      - gstreamer-plugins-base
      - gstreamer-plugins-good
      - gstreamer-plugins-bad
      - gstreamer-plugins-libav
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-libav
  archlinux:
    depends:
      - "wpewebkit>=2.54"
      - gst-plugins-base
      - gst-plugins-good
      - gst-plugins-bad
      - gst-libav
      - "glibc>=2.39"
      - "libgcc_s.so=1-64"
      - libxkbcommon
      - glib2
      - gstreamer
      - gst-plugins-base-libs
      - libpipewire
      - bubblewrap
      - xdg-dbus-proxy
      - ca-certificates
      - vulkan-icd-loader
