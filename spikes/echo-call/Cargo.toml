[package]
name = "echo-call"
description = "Spike 3b: a native echo call — str0m through teams-media's TURN relay, signaling from the Task 18 capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
# the callback links' random segment
getrandom.workspace = true
media-loop.workspace = true
serde_json.workspace = true
str0m.workspace = true
teams-auth.workspace = true
teams-fence.workspace = true
# the TURN client and relay link (moved there from this spike), Teams' SDP dialect
teams-media.workspace = true
teams-proto.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
fixture-guard.workspace = true
tempfile.workspace = true
# the call-flow tests build fences over test rosters
teams-fence = { workspace = true, features = ["test-support"] }
# the echo through the relay runs against teams-media's loopback TURN server
teams-media = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
