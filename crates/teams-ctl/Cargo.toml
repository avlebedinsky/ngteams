[package]
name = "teams-ctl"
description = "The control socket of the running ngteams: its JSON-lines protocol, socket paths, line codec and client, for ngteamsctl and the app's server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# ngteamsctl's times (an event's, a message's) in the local time zone
chrono.workspace = true
# ngteamsctl's command line
clap.workspace = true
# `ngteamsctl completions`: bash, fish and zsh completion scripts (no logging of its own: nothing reaches the log cap)
clap_complete.workspace = true
# `ngteamsctl wait --match`: the event line a wait ends on (no logging of its own: nothing reaches the log cap)
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Native private directory creation shared with the store and logger.
teams-platform.workspace = true

[target.'cfg(unix)'.dependencies]
# Bounded Unix connects and subscription hang-up watches.
rustix = { workspace = true, features = ["event", "net"] }

[target.'cfg(windows)'.dependencies]
# Byte-mode local pipes only: no message-mode diagnostic or credential logging.
interprocess.workspace = true
sha2.workspace = true
windows-sys = { workspace = true, features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
widestring.workspace = true

[dev-dependencies]
# Compile and exercise the app's native listener without its UI/media dependencies.
async-channel.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["sync"] }
# time zones whose clocks skip a midnight, for the calendar's day boundaries
chrono-tz.workspace = true
# each test's sockets and directories, in a directory of its own
tempfile.workspace = true

[lints]
workspace = true
