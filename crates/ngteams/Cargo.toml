[package]
name = "ngteams"
description = "The personal build: the user's own Teams account on the user's desktop, under the personal fence (docs/personal-build.md). Agents compile and mock-test it only; it runs only when scripts/install-personal.sh built it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
# the app, its sign-in window included (teams-signin's window bound to Entra's and the identity provider's hosts),
# and, run again by itself, that window's page engine (`teams_wpe::worker`)
name = "ngteams"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# the app's window: GPUI's Linux platform, Wayland only
gpui-pre.workspace = true
gpui-pre-platform.workspace = true
# the app's own lines in its diagnostic log; capped at `debug` at compile time like teams-trouter's
log = { workspace = true, features = ["max_level_debug", "release_max_level_debug"] }
# the sign-in (the window's protocol, the code exchange, authz and the region), the session, the Secret Service
teams-auth.workspace = true
# the read-only mode's descriptors (the broker's socket, the view trace): whether one handed in is open
libc.workspace = true
# ... a Unix stream socket, or open for writing; both made close-on-exec
rustix = { workspace = true, features = ["fs", "net"] }
# the account's engine, assembled as every binary builds one (`teams_core::account`)
teams-core.workspace = true
# the personal fence: only this crate enables `personal` (docs/personal-build.md; tests/apart.rs checks every manifest)
teams-fence = { workspace = true, features = ["personal"] }
# the diagnostic log, installed once before the engine starts
teams-log.workspace = true
# the calls' devices: the desktop's PipeWire and its camera portal (only this crate enables `personal`;
# `test-support`, which every test build unifies in, wins over it: the UI sandbox's only)
teams-media = { workspace = true, features = ["personal"] }
# the echo service's MRI the test call goes to (`TEAMS_ECHO_BOT_MRI`, from the web bundle)
teams-proto.workspace = true
# the personal sign-in window: only this crate enables `personal`
teams-signin = { workspace = true, features = ["personal"] }
# the sign-in window's page engine: this binary serves it as its worker (`teams_wpe::worker::serve_if_asked`), and
# its build script hands the binary the rpath to WPE WebKit's libraries (DEP_TEAMS_WPE_LIBDIRS)
teams-wpe.workspace = true
# `ngteams --forget` takes the account's engine lock before it deletes anything
teams-store.workspace = true
# the views and the bridge over the engine
teams-ui.workspace = true
thiserror.workspace = true
# the sign-in's and the engine's runtimes; the session's sign-out watch; the read-only mode's broker socket (`net`)
tokio = { workspace = true, features = ["net", "rt", "sync"] }
# the read-only mode opens its window only on the UI sandbox's compositor (`ui_sandbox::in_sandbox`)
ui-sandbox.workspace = true

[dev-dependencies]
# a call's id for the call events the personal app's models are shown (`CallId::for_tests`)
teams-call = { workspace = true, features = ["test-support"] }
# the calls on the mock relay through its loopback TURN server (`Relay::Fixed`)
teams-core = { workspace = true, features = ["test-support"] }
base64.workspace = true
gpui-pre = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
# a personal fence over a test log and given lab locations, its source and the transports reaching the mock; the two
# binaries refuse to run when a test build unified it in
teams-fence = { workspace = true, features = ["test-support", "personal"] }
# the calls' media in the tests: the file devices, the loopback relay's types (`test-support` wins over `personal`: the
# UI sandbox's PipeWire only, and the tests open none)
teams-media = { workspace = true, features = ["test-support", "personal"] }
# the mock's calling service with its media: a loopback TURN server and a peer behind each party it plays
teams-mock = { workspace = true, features = ["media"] }
teams-proto = { workspace = true, features = ["test-support"] }
teams-trouter = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
# the manifest tests read every workspace manifest
toml.workspace = true
wiremock.workspace = true

[lints]
workspace = true
