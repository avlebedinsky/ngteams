[package]
name = "teams-media"
description = "A call's media: the TURN client (RFC 8656) and its relay link, Teams' SDP dialect (sdp-ngc-1.0) to and from str0m's SDP, the relayed str0m peer, echo cancellation, noise suppression and gain control, Opus with a jitter buffer, the audio session on threads of its own, and the device seam (file and PipeWire backends)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Tests only, through dev-dependencies: a minimal TURN server on loopback (`test_turn`), for this crate's tests, the
# mock's media and the engine's call tests, and the signals the audio processing is judged with (`test_signal`).
test-support = ["openh264/source"]
# The personal build's devices: the desktop's PipeWire instead of the UI sandbox's (`devices::pipewire::THIS_BUILD`).
# Only `crates/teams` enables it (crates/teams/tests/apart.rs checks every manifest); `test-support` wins over it.
personal = []

[dependencies]
# STUN FINGERPRINT (CRC-32)
crc32fast.workspace = true
# STUN transaction ids
getrandom.workspace = true
# STUN MESSAGE-INTEGRITY (HMAC-SHA1 over the long-term key MD5(username:realm:password))
hmac.workspace = true
# the PipeWire backend checks its socket belongs to this user (`getuid`)
libc.workspace = true
md-5.workspace = true
# the calls' video codec: H.264 through OpenH264, Cisco's prebuilt library loaded at run time (its bundled source
# only under `test-support`, above)
openh264.workspace = true
# the encoder option the safe API lacks: the bitrate following the bandwidth estimate
openh264-sys2.workspace = true
# the calls' audio codec (libopus, built from its bundled source): 20 ms packets, in-band FEC, DTX
opus.workspace = true
sha1.workspace = true
# the device seam's PipeWire backend: microphone, speaker and camera streams on the PipeWire the build allows
pipewire.workspace = true
# a group call's control plane: its messages are JSON (`mcp`)
serde_json.workspace = true
# the SDP the call's peer speaks: offers and answers taken from and handed to it
str0m.workspace = true
thiserror.workspace = true
# the personal build's camera: the desktop's camera portal, asked on the bus the backend is given (blocking calls, on
# the blocking pool a device opens on; the async-io flavour the app's notifications use, so one zbus in the tree)
zbus.workspace = true
# the microphone's echo cancellation (AEC3), noise suppression and gain control: WebRTC's audio processing module,
# built from the source the binding bundles (BSD-3-Clause; it logs nothing)
webrtc-audio-processing.workspace = true

[dev-dependencies]
# this crate's own tests run against the loopback TURN server, and with `personal` on too they show `test-support`
# wins: such a build still opens only the sandbox's PipeWire
teams-media = { workspace = true, features = ["test-support", "personal"] }
tempfile.workspace = true

[lints]
workspace = true
