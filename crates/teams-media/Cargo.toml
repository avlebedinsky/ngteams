[package]
name = "teams-media"
description = "A call's media: Teams' SDP dialect (sdp-ngc-1.0) to and from libwebrtc's SDP, the relayed libwebrtc peer and its session (the microphone through the audio processing to libwebrtc, libwebrtc's audio to the speaker, the camera and the received video), a group call's control plane, the device seam (file and PipeWire backends), and the player of a video a message carries (GStreamer's playbin fed by the engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Tests only, through dev-dependencies: a minimal TURN server on loopback (`test_turn`), for this crate's tests, the
# mock's media and the engine's call tests, and the signals the audio processing is judged with (`test_signal`).
test-support = ["dep:crc32fast", "dep:hmac", "dep:md-5", "dep:sha1"]
# The personal build's devices: the desktop's PipeWire instead of the UI sandbox's (`devices::pipewire::THIS_BUILD`).
# Only `crates/ngteams` enables it (crates/ngteams/tests/apart.rs checks every manifest); `test-support` wins over it.
personal = []

[dependencies]
# the test TURN server's STUN codec (`test-support`): FINGERPRINT (CRC-32), MESSAGE-INTEGRITY (HMAC-SHA1 over the
# long-term key MD5(username:realm:password))
crc32fast = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
# libwebrtc's answers (SDP, a description applied) are futures: run on the asking thread
futures-executor.workspace = true
futures-util.workspace = true
# STUN transaction ids (the test TURN server) and the data line's SSRC
getrandom.workspace = true
# the PipeWire backend checks its socket belongs to this user (`getuid`)
libc.workspace = true
# a shared video file played in its card: GStreamer's playbin, fed by an appsrc, its frames and sound to appsinks
gstreamer.workspace = true
gstreamer-app.workspace = true
# the call's media: the peer connection (ICE through Teams' relay, DTLS-SRTP, Opus and H.264, the jitter buffer,
# bandwidth estimation, A/V sync), the audio processing module, the data channel
libwebrtc.workspace = true
log.workspace = true
# the device seam's PipeWire backend: microphone, speaker and camera streams on the PipeWire the build allows
pipewire.workspace = true
# a group call's control plane: its messages are JSON (`mcp`)
serde_json.workspace = true
thiserror.workspace = true
# libwebrtc's video source keeps its track alive on a tokio task until the camera's first frame, and the media's
# threads wait for libwebrtc's streams with a timeout: the media's own runtime runs both
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
# the personal build's camera: the desktop's camera portal, asked on the bus the backend is given (blocking calls, on
# the blocking pool a device opens on; the async-io flavour the app's notifications use, so one zbus in the tree)
zbus.workspace = true

[dev-dependencies]
# this crate's own tests run against the loopback TURN server, and with `personal` on too they show `test-support`
# wins: such a build still opens only the sandbox's PipeWire
teams-media = { workspace = true, features = ["test-support", "personal"] }
tempfile.workspace = true

[lints]
workspace = true
