[package]
name = "teams-auth"
description = "Native Teams sign-in: PKCE code exchange, token refresh and storage, skypetoken"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
httpdate.workspace = true
oo7.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# the session: one refresh per audience however many callers wait on it, and its renewal notifications
tokio = { workspace = true, features = ["sync"] }
# form encoding of the token requests and of the authorize URL's query
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# the region record read back from a file
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock.workspace = true

[lints]
workspace = true
