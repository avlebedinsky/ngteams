[package]
name = "teams-trouter"
description = "The native client's Trouter push channel: socket.io 0.9 over WSS, typed chat and call events, and typed call replies on their originating connection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Tests only, through dev-dependencies: `Trouter::with_mock_origin` (plain `ws` to a loopback mock instead of the
# Trouter hosts). It turns on `teams-proto/test-support`, which ngteams refuses to run with.
test-support = ["teams-proto/test-support"]

[dependencies]
# the call controller's deliveries on the calling socket: their bodies gzip'd in base64, decoded for the tracker
base64.workspace = true
flate2.workspace = true
# the socket's halves: the write half goes only to the frame sink
futures-util.workspace = true
# unknown deliveries and service events, logged by kind only. Capped at `debug` at compile time (log's features
# unify, so the cap holds for every crate in a build with this one): tungstenite traces every frame it sends, payload
# and all, and `user.authenticate` carries the bearer token (src/socket.rs)
log = { workspace = true, features = ["max_level_debug", "release_max_level_debug"] }
# a fresh endpoint and correlation id per client and per connect (GUIDs), and the backoff's jitter
getrandom.workspace = true
# the connect URL's `tc` query value, encoded as the web client encodes it
percent-encoding.workspace = true
# the server certificate checked against the system's roots, as the HTTP transport (reqwest) checks it
rustls-platform-verifier.workspace = true
serde_json.workspace = true
# the `ic3` token with its expiry, the renewal notifications and the clock
teams-auth.workspace = true
# the calling socket's decoded deliveries and the account's call tracker
teams-call.workspace = true
# the frame sink and the typed own frames, the registrar registration (a plain request), the message model
teams-proto.workspace = true
# at `debug`, every frame both ways as the diagnostic log's typed record, which redacts `user.authenticate`
teams-log.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
# the WebSocket client; TLS is set up here (tokio-rustls) so the socket trusts what the HTTP transport trusts
tokio-tungstenite.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
# a's writes, sent to the chat service mock as the web client sends them
reqwest.workspace = true
# the registrar reached through the HTTP transport's mock origin
teams-proto = { workspace = true, features = ["test-support"] }
# the Trouter mock, and the chat service mock whose queued events it delivers
teams-mock.workspace = true
teams-trouter = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock.workspace = true

[lints]
workspace = true
