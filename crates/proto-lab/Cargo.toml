[package]
name = "proto-lab"
description = "Protocol lab harness: lab browser profiles, the armed browser fence, captures and scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# reads the claims of the bearer tokens the lab page sends (its identity), never the tokens themselves; decodes base64
# bodies and frames in captures for the sanitizer
base64.workspace = true
clap.workspace = true
fixture-guard.workspace = true
flate2.workspace = true
futures-util.workspace = true
psl.workspace = true
regex.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `proto-lab auth`: PKCE, the code exchange and refresh, the skypetoken, kept in the Secret Service
teams-auth.workspace = true
teams-fence.workspace = true
# a token's expiry as an HTTP date in `proto-lab auth`'s report
httpdate.workspace = true
# `proto-lab auth`: each region save stages in a file of its own before the rename
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
url.workspace = true
zip.workspace = true
zeroize.workspace = true

[dev-dependencies]
# a local HTTPS server: Chrome uploads Reporting API reports only over a secure connection
rcgen.workspace = true
# the fence tests build fences over test rosters and fake membership sources; never a normal dependency, and the
# binary refuses to run when a test build unified it in
teams-fence = { workspace = true, features = ["test-support"] }
# a local websocket server for the CDP client tests
tokio = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true
wiremock.workspace = true

[features]
# builds the live lab tests (`tests/auth_live.rs`); they still run only with PROTO_LAB_LIVE=1, so `--all-features`
# stays offline
live = []

[[test]]
name = "auth_live"
required-features = ["live"]

[lints]
workspace = true
