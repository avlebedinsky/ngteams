[package]
name = "teams-ui"
description = "The GPUI views and models of the native Teams client over teams-core's engine: the bridge that owns the engine, the models it keeps up to date, the shell, the chat list, the chat switcher, the settings, the view trace; no request path of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# the chat list's times, in the local time zone
chrono.workspace = true
# the bridge's drain: the engine's next event or the stop, whichever comes first
futures-util.workspace = true
gpui-pre.workspace = true
# the UI kit: compose's text area, the theme, the resizable panes, the command palette (the chat switcher), avatars,
# buttons, switches and radios
gpui-component.workspace = true
# the view trace: one JSON object per line
serde_json.workspace = true
# the engine: its request side (behind `Core`), its events and its shutdown
teams-core.workspace = true
# a message's content read as rich text, for the chat list's preview line (sanitized, capped; never shown as HTML)
teams-proto.workspace = true
# the rows the engine's queries answer with
teams-store.workspace = true
# the settings file's problems
thiserror.workspace = true
# the bridge's stop signal to its drain task (a runtime-free oneshot)
tokio = { workspace = true, features = ["sync"] }
# the settings file
toml.workspace = true

[dev-dependencies]
# the views on GPUI's test context (`TestAppContext`): a fake core and a fake event source, no window system
gpui-pre = { workspace = true, features = ["test-support"] }
# the kit's widgets on GPUI's test context
gpui-component = { workspace = true, features = ["test-support"] }
# the kit's text area on the real platform, in the UI sandbox: GPUI's Linux platform, Wayland only
gpui-pre-platform.workspace = true
# the settings file, in a directory of its own per test
tempfile.workspace = true
# the push channel's events the fake engine hands the bridge
teams-trouter.workspace = true
# the compositor, private bus and virtual keyboard the kit window test runs in
ui-sandbox.workspace = true
# the kit window test's fake settings portal on the sandbox's bus (the colour scheme the theme follows)
zbus.workspace = true

[[test]]
# the kit's text area and the theme in the UI sandbox: its own `main` (GPUI runs on the main thread), which runs
# itself again inside the sandbox
name = "kit_window"
harness = false

[lints]
workspace = true
