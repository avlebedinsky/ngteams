[package]
name = "teams-proto"
description = "Typed Teams internal API requests and the logged native HTTP transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Tests only, through dev-dependencies: `HttpTransport::with_mock_origin` (plain `http` to a loopback mock instead of
# the service hosts) and `ProbeOwnState` (an own-state request for the transport's tests; the reviewed list itself is
# empty). `teams_proto::test_support_enabled()` reports it so ngteams refuses to run a test-support build.
test-support = []

[dependencies]
# Graph's sharing token of a file's sharing link (base64url), for its thumbnails
base64.workspace = true
# the parsed message HTML's tree, walked iteratively (the version scraper takes)
ego-tree.workspace = true
# a call request's message id and a call's chain id (fresh GUIDs)
getrandom.workspace = true
# the session's tokens (`Credentials`), `TokenError`, and `Retry-After` read as Entra's and authz's answers are
teams-auth.workspace = true
# at `debug`, each request and its answer in full as the diagnostic log's typed records, which redact the credentials
teams-log.workspace = true
# the requests in the app's diagnostic log: by method, host, path, status and latency at `info`; capped at `debug` at
# compile time like teams-trouter's
log = { workspace = true, features = ["max_level_debug", "release_max_level_debug"] }
# a built URL's decoded path is compared with its service's base and the endpoint's segments
percent-encoding.workspace = true
# the transport's own HTTPS client: no proxy, no redirects, its services' bases
reqwest.workspace = true
# a meeting recording's DASH presentation, read into its tracks
roxmltree.workspace = true
# the chat service's message HTML, read into the typed rich-text model
scraper.workspace = true
# the chat service's answers, read into the message model (unknown fields kept)
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# a message's ISO times as milliseconds
time.workspace = true
# the wait before a throttled read, plain or own-state request is sent again
tokio = { workspace = true, features = ["time"] }
url.workspace = true

[dev-dependencies]
teams-call.workspace = true
# a picture's bytes in the Graph fixture
base64.workspace = true
# the transport's tests reach wiremock through the mock origin
teams-proto = { workspace = true, features = ["test-support"] }
# the chat reads' tests run against the mock chat service, through the transport's mock origin
teams-mock.workspace = true
# the diagnostic log's directory in its test (`tests/debug_log.rs`)
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
trybuild.workspace = true
wiremock.workspace = true

[lints]
workspace = true
