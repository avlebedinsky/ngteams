[package]
name = "teams-proto"
description = "Teams internal API requests; every mutating one takes a WritePermit from teams-fence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
teams-fence.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
# the tests mint permits from a fence over a test roster and a fake membership source; the trybuild cases here see it
# too, so the cases that need it off live in crates/fence-seal
teams-fence = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
trybuild.workspace = true

[lints]
workspace = true
