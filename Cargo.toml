[workspace]
resolver = "3"
# Explicit list: cargo refuses a glob that matches nothing. Every new crate is added here.
members = [
    "crates/fence-seal",
    "crates/fixture-guard",
    "crates/proto-lab",
    "crates/teams-app",
    "crates/teams-auth",
    "crates/teams-core",
    "crates/teams-fence",
    "crates/teams-headless",
    "crates/teams-mock",
    "crates/teams-proto",
    "crates/teams-store",
    "crates/teams-trouter",
    "crates/teams-ui",
    "crates/ui-sandbox",
    "spikes/echo-call",
    "spikes/gpui-video",
    "spikes/media-loop",
]
# Patched crates.io sources (scripts/vendor-gpui.sh), used through [patch.crates-io], never workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Shared dependency versions; crates take them with `name.workspace = true`.
[workspace.dependencies]
fixture-guard = { path = "crates/fixture-guard" }
proto-lab = { path = "crates/proto-lab" }
teams-auth = { path = "crates/teams-auth" }
teams-core = { path = "crates/teams-core" }
teams-fence = { path = "crates/teams-fence" }
# tests only: a crate takes it under [dev-dependencies], never [dependencies] (crates/teams-mock/tests/mock.rs checks)
teams-mock = { path = "crates/teams-mock" }
teams-proto = { path = "crates/teams-proto" }
teams-store = { path = "crates/teams-store" }
teams-trouter = { path = "crates/teams-trouter" }
# the GPUI views and models over the engine
teams-ui = { path = "crates/teams-ui" }
# tests and lab runs only: the private compositor, bus, input and URI opener every GUI process runs in
ui-sandbox = { path = "crates/ui-sandbox" }
media-loop = { path = "spikes/media-loop" }
# The video source hands frames to GPUI's foreground executor: the version GPUI already links.
async-channel = "2.5.0"
# base64 bodies and frames in captures, decoded by the sanitizer
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
# STUN FINGERPRINT (CRC-32) for the echo call's TURN client
crc32fast = "1.5.2"
# gzip only, on the zlib-rs backend zip already uses
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# the tree scraper parses into, walked without recursion: the version scraper takes
ego-tree = "0.11.0"
# the system random source: PKCE verifiers and OAuth state
getrandom = "0.4.3"
# GPUI as agterm-rs takes it: the crates.io `gpui-pre` snapshot, pinned exactly so agterm-rs's patches apply as they
# are. Wayland only: without `x11`, GPUI's Linux platform has no X11 backend to fall back to.
gpui-pre = { version = "=0.3.9", default-features = false, features = ["wayland"] }
gpui-pre-platform = { version = "=0.3.9", default-features = false, features = ["wayland"] }
# The UI kit (Apache-2.0; M2 Task 7's audit): built for `gpui-pre =0.3.9`, so it resolves to the vendored patched
# copy above. It takes `gpui-pre` with its default features, so the workspace's GPUI gains `x11`, `font-kit` and
# `windows-manifest` (the lab app refuses a set `DISPLAY`); none of the kit's own optional features.
gpui-component = { version = "0.8.0", default-features = false }
# GPUI's `RenderImage` frames are `image` buffers: the version GPUI already links.
image = { version = "0.25.10", default-features = false }
# STUN MESSAGE-INTEGRITY (HMAC-SHA1 over a long-term key) for the echo call's TURN client
hmac = "0.13.0"
# a Retry-After given as an HTTP date
httpdate = "1.0.3"
# the UI sandbox's spawn marks every inherited descriptor but the named ones close-on-exec (`close_range`, which rustix
# doesn't wrap): the version the workspace already links
libc = "0.2.191"
log = "0.4.34"
# the STUN long-term credential key: MD5(username:realm:password), RFC 8489 9.2.2
md-5 = "0.11.0"
# decodes the chat service's path segments (encoded conversation ids) when the fence maps a write
percent-encoding = "2.3.2"
# The async-io flavour GPUI's Linux platform takes too: its ashpd and zbus refuse to build with both `async-io` and
# `tokio` on, and workspace builds unify features, so oo7's default `tokio` would break every workspace build with
# GPUI in it. async-io runs its own reactor thread, so the futures still run under tokio.
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
# libopus, built from source by opusic-sys (its default `bundled` feature)
opus = "0.4.0"
# the Public Suffix List, compiled in: which dotted part of a display name ends in a real top-level domain
psl = "2.1.243"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
# the Trouter socket checks the server certificate as reqwest does (the system verifier)
rustls-platform-verifier = "0.7.1"
# the local store: SQLite built from source (`bundled`), so every machine runs the same version
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["process"] }
# the chat service's message HTML, read into a small typed model (teams-proto's `chat::html`): html5ever's
# browser-grade parse, as a tree to walk; without the CLI (`main`) and the parse-error list (`errors`)
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
# sans-IO WebRTC; rust-crypto does DTLS and SRTP in pure Rust (no OpenSSL), but dimpl generates its certificate with
# rcgen on aws-lc-rs, so the aws-lc-sys C build stays; no example web server
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
# the chat service's ISO times (a message's `composetime`, `originalarrivaltime`), read as RFC 3339
time = { version = "0.3.55", features = ["parsing"] }
tokio = "1.53.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
# edits lab.toml in place (the MRI of an account after its first login), keeping its comments
toml_edit = "0.25.17"
trybuild = "1.0.122"
url = "2.5.8"
# The UI sandbox's virtual keyboard and pointer: a Wayland client of the nested niri, on the versions GPUI already
# links (wayland-client, the wlr protocols) and the misc protocols built for them (`zwp_virtual_keyboard_v1`).
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wiremock = "0.6.5"
# the virtual keyboard's keymap and its text-to-key table: the version GPUI already links, without its features
xkbcommon = { version = "0.8.0", default-features = false }
# D-Bus for the UI sandbox's fake notification server and tray watcher: the version and the async-io flavour GPUI's
# ashpd already takes (a `tokio` flavour breaks every workspace build with GPUI in it, as for oo7)
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = "1.9.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Same lint set as agterm-rs. Every crate opts in with `[lints] workspace = true`, spikes included; only generated
# -sys crates may set their own (scripts/lint-report.sh). A function over a complexity limit (clippy.toml) is split,
# not excused: the only exception is an outer `#[expect(clippy::..., reason = "...")]` on that one item.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# complexity (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
# robustness
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# FFI
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# exceptions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The gpui-video spike converts 1280x720 frames on the CPU; unoptimized, one conversion takes ~250 ms, so even the
# debug tests of its video grid get optimized code for that crate (its dependencies stay as they are).
[profile.dev.package.gpui-video]
opt-level = 3

# GPUI with agterm-rs's external-surfaces patches (M0 Task 16, approach (b) of the video spike):
# `Window::paint_external_surface` draws CPU pixels uploaded into a texture kept per surface, or a dmabuf imported on
# the GPU, instead of a new sprite atlas texture per video frame. vendor/gpui-pre and vendor/gpui-pre-wgpu are the verified crates.io sources of the
# pinned 0.3.9 plus build/patches/gpui-pre{,-wgpu} (scripts/vendor-gpui.sh; `--check` verifies them).
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
