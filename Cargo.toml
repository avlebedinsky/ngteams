[workspace]
resolver = "3"
# Explicit list: cargo refuses a glob that matches nothing. Every new crate is added here.
members = [
    "crates/fixture-guard",
    "crates/proto-lab",
    "crates/teams-auth",
    "crates/teams-fence",
    "crates/teams-proto",
    "spikes/gpui-video",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Shared dependency versions; crates take them with `name.workspace = true`.
[workspace.dependencies]
fixture-guard = { path = "crates/fixture-guard" }
teams-auth = { path = "crates/teams-auth" }
teams-fence = { path = "crates/teams-fence" }
teams-proto = { path = "crates/teams-proto" }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# GPUI as agterm-rs takes it: the crates.io `gpui-pre` snapshot, pinned exactly so agterm-rs's patches apply as they
# are. Wayland only: without `x11`, GPUI's Linux platform has no X11 backend to fall back to.
gpui-pre = { version = "=0.3.9", default-features = false, features = ["wayland"] }
gpui-pre-platform = { version = "=0.3.9", default-features = false, features = ["wayland"] }
# GPUI's `RenderImage` frames are `image` buffers: the version GPUI already links.
image = { version = "0.25.10", default-features = false }
log = "0.4.34"
# The async-io flavour GPUI's Linux platform takes too: its ashpd and zbus refuse to build with both `async-io` and
# `tokio` on, and workspace builds unify features, so oo7's default `tokio` would break every workspace build with
# GPUI in it. async-io runs its own reactor thread, so the futures still run under tokio.
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustix = { version = "1.1.5", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
trybuild = "1.0.122"
wiremock = "0.6.5"
zeroize = "1.9.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Same lint set as agterm-rs. Every crate opts in with `[lints] workspace = true`, spikes included; only generated
# -sys crates may set their own (scripts/lint-report.sh). A function over a complexity limit (clippy.toml) is split,
# not excused: the only exception is an outer `#[expect(clippy::..., reason = "...")]` on that one item.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# complexity (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
# robustness
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# FFI
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# exceptions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
